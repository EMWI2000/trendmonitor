[project]
name = "trendmonitor"
version = "0.1.0"
description = "Daily Shopify catalogue snapshots of peer brands, attribute tagging and weekly sell-out report"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13.0",
    "duckdb>=1.5.6",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "pyyaml>=6.0.3",
    "requests>=2.32",
]

[project.scripts]
trendmonitor = "trendmonitor.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trendmonitor"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
