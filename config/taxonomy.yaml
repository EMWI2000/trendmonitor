# Closed attribute taxonomy. Every tag written to data/tags.parquet must use one of the
# values listed here (or null when unknown). This file is the source of truth: the Claude
# tagger builds its output schema from it, the rule tagger reads the keywords from it, and
# tests fail if a tag uses a value outside it.
#
# Changing a value or adding one is a pull request against this file, because it breaks
# comparability of the time series. Keywords are matched case-insensitively against title,
# tags, product_type and the first 600 characters of the description (Danish and English).
#
# DRAFT for validation with the design team. Expected edits: print families that matter to
# Baum's own language (e.g. split "floral" into painterly / ditsy / botanical), and silhouette
# values per category.

version: 0.1

