# Peer set. Only Shopify storefronts with a public /products.json are supported.
# Run `uv run trendmonitor probe` to verify each URL; it writes the result to data/probe.json
# and the daily job skips brands that do not respond. Keep `enabled: false` for brands
# you have not verified yet, or that have disabled the endpoint.
#
# Fields: key (slug used in data), name, url (storefront root, no trailing slash),
# role (self | peer | benchmark), enabled, size_option (which optionN holds size; null = auto).

user_agent: "trendmonitor/0.1 (+contact: set TM_CONTACT env var)"
request_delay_seconds: 1.0
page_size: 250
max_pages: 40

brands:
